{% extends "base.html" %}
{% load static %}

{% block title %}Новый пароль — {{ site.site_name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h2 class="form-title"><i class="fas fa-lock"></i> Новый пароль</h2>

        <form id="confirmForm">
            <div class="form-group">
                <label for="password1">Новый пароль</label>
                <input type="password" id="password1" required minlength="8" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="password2">Повторите пароль</label>
                <input type="password" id="password2" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn-primary"><i class="fas fa-check"></i> Сохранить</button>
        </form>

        <div class="form-link">
            <a href="/login/"><i class="fas fa-arrow-left"></i> Вернуться к входу</a>
        </div>
    </div>
</div>

<script>
document.getElementById('confirmForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const p1 = document.getElementById('password1').value;
    const p2 = document.getElementById('password2').value;
    if (p1 !== p2) {
        showToast('Ошибка', 'Пароли не совпадают', 'error');
        return;
    }

    const q = new URLSearchParams(window.location.search);
    const result = await apiRequest('/auth/password/reset/confirm/', {
        method: 'POST',
        body: JSON.stringify({ uid: q.get('uid'), token: q.get('token'), new_password: p1 }),
    });

    if (result && result.ok) {
        showToast('Готово', 'Пароль изменён, теперь можно войти', 'success');
        setTimeout(() => { window.location.href = '/login/'; }, 1500);
    } else {
        showToast('Ошибка', (result && result.data && result.data.error) || 'Не получилось сменить пароль', 'error');
    }
});
</script>
{% endblock %}
