{% extends "base.html" %}
{% load static %}

{% block title %}Восстановление пароля — {{ site.site_name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h2 class="form-title">
            <i class="fas fa-key"></i> Восстановление пароля
        </h2>
        
        <p style="color:#555;margin-bottom:20px;text-align:center;font-size:14px;">
            Введите email, указанный при регистрации. Мы отправим ссылку для сброса пароля.
        </p>
        
        <form id="resetForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>
            
            <button type="submit" class="btn-primary">
                <i class="fas fa-paper-plane"></i> Отправить ссылку
            </button>
        </form>
        
        <div class="form-link">
            <a href="/login/"><i class="fas fa-arrow-left"></i> Вернуться к входу</a>
        </div>
    </div>
</div>

<script>
document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const email = document.getElementById('email').value.trim();
    btn.disabled = true;

    const result = await apiRequest('/auth/password/reset/', {
        method: 'POST',
        body: JSON.stringify({ email }),
    });

    btn.disabled = false;
    if (result && result.ok) {
        showToast('Проверь почту', 'Если такой email есть у нас, мы отправили ссылку для сброса', 'success');
        setTimeout(() => { window.location.href = '/login/'; }, 2500);
    } else if (result && result.status === 429) {
        const wait = Math.ceil((result.data && result.data.wait ? result.data.wait : 0) / 60);
        showToast('Слишком часто', wait ? `Попробуй через ${wait} мин.` : 'Попробуй позже', 'error');
    } else {
        showToast('Ошибка', (result && result.data && result.data.error) || 'Не удалось отправить запрос', 'error');
    }
});
</script>
{% endblock %}
