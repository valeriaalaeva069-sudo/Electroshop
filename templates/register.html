{% extends "base.html" %}
{% load static %}

{% block title %}Регистрация — {{ site.site_name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h2 class="form-title">
            <i class="fas fa-user-plus"></i> Регистрация
        </h2>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="full_name">ФИО *</label>
                <input type="text" id="full_name" name="full_name" required placeholder="Иванов Иван Иванович">
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label for="username">Логин *</label>
                <input type="text" id="username" name="username" required placeholder="username">
            </div>
            
            <div class="form-group">
                <label for="city">Город</label>
                <input type="text" id="city" name="city" placeholder="Москва">
            </div>
            
            <div class="form-group">
                <label for="age">Возраст</label>
                <input type="number" id="age" name="age" min="1" max="120" placeholder="25">
            </div>
            
            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="text" id="phone" name="phone" placeholder="+7 (999) 123-45-67">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль * (минимум 8 символов, не только цифры)</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label for="password2">Подтверждение пароля *</label>
                <input type="password" id="password2" name="password2" required minlength="8" autocomplete="new-password" placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-primary">
                <i class="fas fa-user-plus"></i> Зарегистрироваться
            </button>
        </form>
        
        <div class="form-link">
            Уже есть аккаунт? <a href="/login/">Войти</a>
        </div>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    
    if (password !== password2) {
        showToast('Ошибка', 'Пароли не совпадают', 'error');
        return;
    }
    
    const data = {
        full_name: document.getElementById('full_name').value,
        email: document.getElementById('email').value,
        username: document.getElementById('username').value,
        city: document.getElementById('city').value,
        age: document.getElementById('age').value || null,
        phone: document.getElementById('phone').value,
        password: password,
        password2: password2,
    };
    
    const result = await apiRequest('/auth/register/', {
        method: 'POST',
        body: JSON.stringify(data),
    });
    
    if (result && result.ok) {
        setToken(result.data.tokens.access);
        localStorage.setItem('refresh_token', result.data.tokens.refresh);
        setUser(result.data.user);
        
        showToast('Успешно!', 'Вы успешно зарегистрированы!', 'success');
        
        setTimeout(() => {
            window.location.href = '/';
        }, 1000);
    } else {
        let errorMsg = 'Ошибка регистрации';
        if (result?.data) {
            const errors = Object.values(result.data).flat();
            if (errors.length) errorMsg = errors.join(', ');
        }
        showToast('Ошибка', errorMsg, 'error');
    }
});
</script>
{% endblock %}
